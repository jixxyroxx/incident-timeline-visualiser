version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: tool92-postgres
    environment:
      POSTGRES_DB: tool92db
      POSTGRES_USER: tool92user
      POSTGRES_PASSWORD: tool92pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tool92-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: tool92-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tool92db
      SPRING_DATASOURCE_USERNAME: tool92user
      SPRING_DATASOURCE_PASSWORD: tool92pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: your-secret-key-here-make-it-long-enough
      JWT_EXPIRATION: 86400000
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data: